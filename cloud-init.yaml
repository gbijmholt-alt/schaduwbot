#cloud-config
# Schaduwbot – plak dit in het veld "Cloud config" bij het aanmaken van de Hetzner-server.
# Vervang de drie waarden tussen <<...>> hieronder. Verder niets wijzigen.
# In tegenstelling tot de vorige versie hoeft hier verder niets te lukken: als er iets
# misgaat, meldt de server dat zelf terug naar GitHub (branch 'status') en probeert het
# elke 5 minuten opnieuw, ook zonder dat iemand inlogt op de server.
write_files:
  - path: /root/env.sh
    permissions: "0600"
    content: |
      export GITHUB_REPO="<<GITHUB_GEBRUIKER>>/schaduwbot"
      export GITHUB_TOKEN="<<GITHUB_TOKEN>>"
      export HELIUS_API_KEY="<<HELIUS_API_KEY>>"
runcmd:
  - bash -c 'set -a; source /root/env.sh; set +a; curl --retry 15 --retry-delay 5 --retry-connrefused -fsSL "https://raw.githubusercontent.com/${GITHUB_REPO}/main/bootstrap.sh" -o /root/bootstrap.sh && bash /root/bootstrap.sh'
